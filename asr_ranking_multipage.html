<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مهمة ترتيب النصوص</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
  body { font-family: 'Noto Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;
         max-width: 700px; margin: 30px auto; color: #222; direction: rtl; text-align: right; }
  h2 { font-size: 18px; }
  .progress { font-size: 13px; color: #777; margin-bottom: 6px; }
  .instructions { background: #f5f7fa; padding: 12px 16px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; line-height: 1.6; }
  #pool {
    min-height: 60px; border: 2px dashed #aaa; border-radius: 6px; padding: 10px;
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; background: #fafafa;
  }
  .rank-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .rank-label { width: 70px; font-weight: bold; flex-shrink: 0; text-align: right; color: #555; }
  .rank-bin {
    flex: 1; min-height: 46px; border: 1px solid #ccc; border-radius: 6px;
    background: #fff; padding: 6px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end;
  }
  .sentence-card {
    background: #e8f0fe; border: 1px solid #a9c4f5; border-radius: 5px;
    padding: 6px 10px; font-size: 15px; line-height: 1.5; cursor: grab; max-width: 280px;
  }
  .sentence-card:active { cursor: grabbing; }
  #status { margin-top: 10px; font-size: 13px; color: #555; }
  .nav-row { display: flex; justify-content: space-between; margin-top: 18px; }
  button {
    padding: 8px 18px; border: none; border-radius: 5px; cursor: pointer; font-size: 14px;
  }
  #backBtn { background: #e5e7eb; color: #333; }
  #backBtn:disabled { opacity: 0.4; cursor: not-allowed; }
  #nextBtn { background: #2563eb; color: white; }
  #nextBtn:disabled { background: #aaa; cursor: not-allowed; }
  #doneScreen { display: none; text-align: center; padding: 40px 0; }
  #doneScreen button { margin-top: 16px; }
</style>
</head>
<body>

<div id="taskScreen">
  <div class="progress" id="progressText"></div>
  <h2>رتّب هذه النصوص المستخرجة آلياً حسب دقتها</h2>
  <div class="instructions">
    اسحب كل جملة إلى إحدى خانات الترتيب أدناه. <b>يُسمح بالتعادل</b> — ضع جملتين أو أكثر
    في نفس الخانة إذا كانت دقتها متساوية. يجب وضع جميع الجمل قبل أن تتمكن من المتابعة.
  </div>
  <div id="pool"></div>
  <div id="bins"></div>
  <div id="status"></div>
  <div class="nav-row">
    <button id="backBtn">السابق</button>
    <button id="nextBtn" disabled>التالي</button>
  </div>
</div>

<div id="doneScreen">
  <h2>تم الانتهاء من المهمة</h2>
  <p>شكراً لمشاركتك. سيتم الآن حفظ نتائجك في ملف.</p>
  <button id="downloadBtn">تنزيل النتائج</button>
</div>

<script>
// =====================================================================
// 1. TASK DATA — 5 tasks, 6 sentences each.
//    Replace the placeholder Arabic text below with your real ASR outputs.
// =====================================================================
const tasks = [
  {
    id: "task1",
    sentences: [
      { id: "s1", text: "الثعلب البني السريع يقفز فوق الكلب الكسول." },
      { id: "s2", text: "الثعلب البني السريع يقفز فوق الكلاب الكسولة." },
      { id: "s3", text: "الثعلب البني السريع قفز فوق الكلب الكسول." },
      { id: "s4", text: "ثعلب بني سريع يقفز فوق كلب كسول." },
      { id: "s5", text: "الثعلب البني السريع يقفز فوق الكلب الكسلان." },
      { id: "s6", text: "ثعلب بُنّي سريع يقفز فوق كلبٍ كسول." }
    ]
  },
  {
    id: "task2",
    sentences: [
      { id: "s1", text: "الجو اليوم مشمس والحرارة معتدلة." },
      { id: "s2", text: "الجو اليوم مشمس والحرارة متعادلة." },
      { id: "s3", text: "الجوّ اليوم مشمس والحرارة معتدلة." },
      { id: "s4", text: "الجو اليوم غائم والحرارة معتدلة." },
      { id: "s5", text: "الجو اليوم مشمس والحرارة عالية." },
      { id: "s6", text: "جو اليوم مشمس حرارة معتدلة." }
    ]
  },
  {
    id: "task3",
    sentences: [
      { id: "s1", text: "قررت الحكومة رفع أسعار الوقود بنسبة عشرة بالمئة." },
      { id: "s2", text: "قررت الحكومة رفع أسعار الوقود بنسبة عشرين بالمئة." },
      { id: "s3", text: "قررت الحكومة رفع أسعار الوقود بنسبة عشرة بالمائة." },
      { id: "s4", text: "قررت الحكومه رفع اسعار الوقود بنسبه عشره بالمئه." },
      { id: "s5", text: "الحكومة قررت رفع أسعار الوقود بنسبة عشرة بالمئة." },
      { id: "s6", text: "قررت الحكومة خفض أسعار الوقود بنسبة عشرة بالمئة." }
    ]
  },
  {
    id: "task4",
    sentences: [
      { id: "s1", text: "سيقام المؤتمر السنوي في الرياض الشهر المقبل." },
      { id: "s2", text: "سيقام المؤتمر السنوي في الرياض الشهر القادم." },
      { id: "s3", text: "سوف يقام المؤتمر السنوي في الرياض الشهر المقبل." },
      { id: "s4", text: "سيقام المؤتمر السنوي في جدة الشهر المقبل." },
      { id: "s5", text: "سيُقام المؤتمر السنوي في الرياض الشهر المقبل." },
      { id: "s6", text: "سيقام مؤتمر سنوي في الرياض الشهر المقبل." }
    ]
  },
  {
    id: "task5",
    sentences: [
      { id: "s1", text: "أعلنت الشركة عن نتائجها المالية للربع الثالث." },
      { id: "s2", text: "أعلنت الشركة عن نتائجها المالية للربع الثاني." },
      { id: "s3", text: "أعلنت الشركة عن نتائجها الماليه للربع الثالث." },
      { id: "s4", text: "أعلنت شركة عن نتائجها المالية للربع الثالث." },
      { id: "s5", text: "أعلنت الشركة عن نتائجها المالية للربع الثالث." },
      { id: "s6", text: "أعلنت الشركة نتائجها المالية للربع الثالث." }
    ]
  }
];

const NUM_RANKS = 6;

// =====================================================================
// 2. STATE
// =====================================================================
let currentPage = 0;
// savedResults[taskId] = { sentenceId: rank, ... }
const savedResults = {};
let sortableInstances = [];

// Optional: capture a participant ID from the URL, e.g. ?pid=ABC123
// (useful later if you link here from Prolific/MTurk)
const urlParams = new URLSearchParams(window.location.search);
const participantId = urlParams.get('pid') || null;

const taskScreen = document.getElementById('taskScreen');
const doneScreen = document.getElementById('doneScreen');
const progressText = document.getElementById('progressText');
const pool = document.getElementById('pool');
const binsContainer = document.getElementById('bins');
const statusEl = document.getElementById('status');
const backBtn = document.getElementById('backBtn');
const nextBtn = document.getElementById('nextBtn');
const downloadBtn = document.getElementById('downloadBtn');

// =====================================================================
// 3. RENDER A PAGE
// =====================================================================
function renderPage(index) {
  const task = tasks[index];
  progressText.textContent = `المهمة ${index + 1} من ${tasks.length}`;

  // Destroy previous Sortable instances to avoid duplicate handlers
  sortableInstances.forEach(s => s.destroy());
  sortableInstances = [];

  pool.innerHTML = '';
  binsContainer.innerHTML = '';

  const previousAnswer = savedResults[task.id] || null;

  // Render pool: any sentence not already placed in the saved answer
  task.sentences.forEach(s => {
    const card = document.createElement('div');
    card.className = 'sentence-card';
    card.dataset.id = s.id;
    card.dir = 'rtl';
    card.textContent = s.text;
    if (!previousAnswer || !(s.id in previousAnswer)) {
      pool.appendChild(card);
    }
  });

  // Render rank bins
  const binEls = [];
  for (let r = 1; r <= NUM_RANKS; r++) {
    const row = document.createElement('div');
    row.className = 'rank-row';
    row.innerHTML = `<div class="rank-label">الترتيب ${r}</div>`;
    const bin = document.createElement('div');
    bin.className = 'rank-bin';
    bin.dataset.rank = r;
    row.appendChild(bin);
    binsContainer.appendChild(row);
    binEls.push(bin);
  }

  // Restore any previously saved placements for this task (e.g. user hit Back then Next again)
  if (previousAnswer) {
    task.sentences.forEach(s => {
      const rank = previousAnswer[s.id];
      if (rank) {
        const card = document.createElement('div');
        card.className = 'sentence-card';
        card.dataset.id = s.id;
        card.dir = 'rtl';
        card.textContent = s.text;
        binEls[rank - 1].appendChild(card);
      }
    });
  }

  // Wire up drag-and-drop
  const allContainers = [pool, ...binEls];
  allContainers.forEach(container => {
    const s = new Sortable(container, {
      group: 'ranking',
      animation: 150,
      onEnd: checkComplete
    });
    sortableInstances.push(s);
  });

  backBtn.disabled = (index === 0);
  nextBtn.textContent = (index === tasks.length - 1) ? 'إنهاء' : 'التالي';

  checkComplete();
}

function currentBins() {
  return Array.from(binsContainer.querySelectorAll('.rank-bin'));
}

function computeRanksForCurrentPage() {
  const result = {};
  currentBins().forEach(bin => {
    const rank = Number(bin.dataset.rank);
    Array.from(bin.children).forEach(card => {
      result[card.dataset.id] = rank;
    });
  });
  return result;
}

function checkComplete() {
  const task = tasks[currentPage];
  const placed = currentBins().reduce((sum, b) => sum + b.children.length, 0);
  const allPlaced = placed === task.sentences.length;
  nextBtn.disabled = !allPlaced;
  statusEl.textContent = allPlaced
    ? 'تم ترتيب جميع الجمل.'
    : `تبقّى ${task.sentences.length - placed} جملة/جمل لم تُرتَّب.`;
}

// =====================================================================
// 4. NAVIGATION
// =====================================================================
backBtn.addEventListener('click', () => {
  // Save whatever is currently placed (even if partial) before leaving the page
  savedResults[tasks[currentPage].id] = computeRanksForCurrentPage();
  currentPage--;
  renderPage(currentPage);
});

nextBtn.addEventListener('click', () => {
  savedResults[tasks[currentPage].id] = computeRanksForCurrentPage();

  if (currentPage === tasks.length - 1) {
    finishTask();
  } else {
    currentPage++;
    renderPage(currentPage);
  }
});

// =====================================================================
// 5. FINISH: SHOW DOWNLOAD SCREEN
// =====================================================================
function finishTask() {
  taskScreen.style.display = 'none';
  doneScreen.style.display = 'block';
}

downloadBtn.addEventListener('click', () => {
  const output = {
    participantId: participantId,
    completedAt: new Date().toISOString(),
    results: tasks.map(task => ({
      taskId: task.id,
      sentences: task.sentences.map(s => ({
        id: s.id,
        text: s.text,
        rank: savedResults[task.id][s.id]
      }))
    }))
  };

  const blob = new Blob([JSON.stringify(output, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const filenameSuffix = participantId ? participantId : Date.now();
  a.href = url;
  a.download = `asr_ranking_results_${filenameSuffix}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  downloadBtn.textContent = 'تم التنزيل ✓';
  downloadBtn.disabled = true;
});

// =====================================================================
// 6. START
// =====================================================================
renderPage(currentPage);
</script>

</body>
</html>
